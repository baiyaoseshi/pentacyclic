[project]
name = "pentacyclic-community"
version = "0.1.0"
description = "五环耗散系统 · 训练诊断工具 社区版 —— 基于热力学-信息论的 ML 训练因果诊断"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/tanghaodong/pentacyclic-community"
Repository = "https://github.com/tanghaodong/pentacyclic-community"

[tool.setuptools]
py-modules = ["app"]
